<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

</head>
<body>

  
  <header>
  <div class="contenedor-header">
    <a href="index.html" class="logo">
      <img src="Img/logo.png" alt="Logo de Alformetalicas SAS" />
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="nosotros.html">Nosotros</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        
        <li><a href="registro.html" class="btn-registrarse">Contáctanos</a></li>
      </ul>
    </nav>
  </div>
</header>
<section class="seccion-trabaja">
  <div class="overlay-trabaja"></div>

  <div class="contenido-trabaja">

    <!-- NUEVO CONTENEDOR -->
    <div class="encabezado-trabaja">
      <h1>Trabaja con nosotros</h1>
      <p class="subtitulo-trabaja">
        Déjanos tus datos y nuestro equipo se pondrá en contacto contigo lo más pronto posible.
      </p>
    </div>

    <div class="tarjeta-formulario">
      <h2>Formulario de contacto</h2>
      

      <!-- FORMULARIO FUNCIONAL -->
      <form action="https://formspree.io/f/xojvzlvr" method="POST" class="formulario-contacto">

  <input type="hidden" name="_subject" value="Nuevo contacto - Alformetalicas">
  <input type="hidden" name="_template" value="table">

  <div class="campo">
    <label>Nombre completo</label>
    <input type="text" name="nombre" required>
  </div>

  <div class="campo">
    <label>Correo electrónico</label>
    <input type="email" name="email" required>
  </div>

  <div class="campo">
    <label>Teléfono</label>
    <input type="tel" name="telefono">
  </div>

  <div class="campo">
    <label>Mensaje</label>
    <textarea name="mensaje" rows="4" required></textarea>
  </div>

  <button type="submit" class="btn-enviar">
    Enviar información
  </button>
</form>

    </div>
  </div>
</section>
 <footer>

    </div>
  </footer>

</body>
