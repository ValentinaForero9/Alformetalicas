<!DOCTYPE html>
<html lang="es">
<head>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <img src="Img/logo.png" alt="Logo de Mi Empresa" />
    </a>
    <div class="contenedor">
      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="servicios.html">Servicios</a></li>

        </ul>
      </nav>
    </div>
  </header>

  <main class="seccion-registro">
    <h1>Registro</h1>
    <form action="https://formsubmit.co/tinti1504@gmail.com" method="POST" class="formulario-registro">
      <label for="nombre">Nombre completo:</label>
      <input type="text" id="nombre" name="nombre" required />

      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" name="correo" required />

      <label for="telefono">Teléfono:</label>
      <input type="tel" id="telefono" name="telefono" required />

      <label for="empresa">Nombre de empresa (opcional):</label>
      <input type="text" id="empresa" name="empresa" />

      <label for="mensaje">Mensaje o comentarios:</label>
      <textarea id="mensaje" name="mensaje" rows="4"></textarea>

      <button type="submit">Enviar</button>
    </form>
  </main>

  <footer>

  </footer>
